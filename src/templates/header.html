<header class="main-header">
    <div class="header-container">
        <!-- Logo -->
        <a href="{{path_prefix}}{{lang}}/" class="logo-link" aria-label="La Fiancée du Pirate">
            <img src="{{path_prefix}}assets/images/logo/logo_pirate.webp" width="150" height="150" alt="La Fiancée du Pirate Logo" class="logo-img">
        </a>
        
        <!-- Navigation Menu -->
        <nav class="nav-menu" id="navMenu">
            <ul class="nav-list">
                <li class="nav-item"><a href="{{path_prefix}}{{lang}}/" class="nav-link {{active_home}}">{{nav.home}}</a></li>
                <li class="nav-item"><a href="{{path_prefix}}{{lang}}/chambres/" class="nav-link {{active_rooms}}">{{nav.rooms}}</a></li>
                <li class="nav-item"><a href="{{path_prefix}}{{lang}}/services/" class="nav-link {{active_services}}">{{nav.services}}</a></li>
                <li class="nav-item"><a href="{{path_prefix}}{{lang}}/galerie/" class="nav-link {{active_gallery}}">{{nav.gallery}}</a></li>
                <li class="nav-item"><a href="{{path_prefix}}{{lang}}/contact/" class="nav-link {{active_contact}}">{{nav.contact}}</a></li>
            </ul>
            <!-- Mobile Only Actions (Book & Lang) -->
            <div class="mobile-only-actions">
                <div class="header-booking-wrapper-mobile" style="position: relative; width: 100%;">
                    <button class="btn btn-secondary btn-book-mobile" id="mobileBookingToggle" onclick="toggleHeaderBooking('mobileHeaderBookingPopup')" style="width: 100%;">
                        {{nav.book}}
                    </button>
                    <!-- Mobile Popup -->
                    <div id="mobileHeaderBookingPopup" style="display: none; position: absolute; top: 120%; left: 0; right: 0; background: var(--color-primary); padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; border: 1px solid rgba(255,255,255,0.1); flex-direction: column; gap: 10px;">
                        <form class="header-booking-form" action="{{booking_url}}" method="GET" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 10px;">
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <label for="mHeadCheckIn" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-regular fa-calendar-days"></i> {{booking_bar.check_in}}</label>
                                <input type="date" id="mHeadCheckIn" name="start_date" required style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <label for="mHeadCheckOut" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-regular fa-calendar-days"></i> {{booking_bar.check_out}}</label>
                                <input type="date" id="mHeadCheckOut" name="end_date" required style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
                                    <label for="mHeadGuests" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-solid fa-user"></i> {{booking_bar.guests}}</label>
                                    <select id="mHeadGuests" name="adults" style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                        <option value="1" style="background: var(--color-primary);">1</option>
                                        <option value="2" selected style="background: var(--color-primary);">2</option>
                                        <option value="3" style="background: var(--color-primary);">3</option>
                                        <option value="4" style="background: var(--color-primary);">4</option>
                                    </select>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
                                    <label for="mHeadChildren" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-solid fa-child"></i> {{booking_bar.children}}</label>
                                    <select id="mHeadChildren" name="children" style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                        <option value="0" selected style="background: var(--color-primary);">0</option>
                                        <option value="1" style="background: var(--color-primary);">1</option>
                                        <option value="2" style="background: var(--color-primary);">2</option>
                                        <option value="3" style="background: var(--color-primary);">3</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 10px; padding: 10px;">{{booking_bar.search}}</button>
                        </form>
                    </div>
                </div>
                
                <div class="lang-selector">
                    <button class="lang-btn" aria-haspopup="true" aria-expanded="false" id="langBtnMobile">
                        <i class="fa-solid fa-globe"></i>
                        <span class="active-lang-code">{{lang_upper}}</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <ul class="lang-dropdown" aria-labelledby="langBtnMobile" id="langDropdownMobile">
                        <li><a href="{{path_prefix}}fr/{{page_path}}" class="lang-dropdown-link {{active_lang_fr}}">FR</a></li>
                        <li><a href="{{path_prefix}}en/{{page_path}}" class="lang-dropdown-link {{active_lang_en}}">EN</a></li>
                        <li><a href="{{path_prefix}}de/{{page_path}}" class="lang-dropdown-link {{active_lang_de}}">DE</a></li>
                        <li><a href="{{path_prefix}}it/{{page_path}}" class="lang-dropdown-link {{active_lang_it}}">IT</a></li>
                        <li><a href="{{path_prefix}}es/{{page_path}}" class="lang-dropdown-link {{active_lang_es}}">ES</a></li>
                        <li><a href="{{path_prefix}}ru/{{page_path}}" class="lang-dropdown-link {{active_lang_ru}}">RU</a></li>
                        <li><a href="{{path_prefix}}en-au/{{page_path}}" class="lang-dropdown-link {{active_lang_en_au}}">EN-AU</a></li>
                    </ul>
                </div>
            </div>

            <!-- Mobile Contact Info -->
            <div class="mobile-contact-info">
                <div style="display: flex; gap: 1.5rem;">
                    <a href="tel:+33493766740" aria-label="Téléphone" style="color: var(--color-white); font-size: 1.8rem;"><i class="fa-solid fa-phone"></i></a>
                    <a href="mailto:info@fianceedupirate.com" aria-label="Email" style="color: var(--color-white); font-size: 1.8rem;"><i class="fa-solid fa-envelope"></i></a>
                    <a href="https://wa.me/33672003384" target="_blank" rel="noopener" aria-label="WhatsApp" style="color: var(--color-white); font-size: 1.8rem;"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
                <div class="mobile-social-links" style="display: flex; gap: 1.5rem;">
                    <a href="https://www.facebook.com/hotellafianceedupirate/" target="_blank" rel="noopener" aria-label="Facebook" style="color: var(--color-white); font-size: 1.8rem;"><i class="fa-brands fa-facebook"></i></a>
                    <a href="https://www.instagram.com/la_fiancee_du_pirate/" target="_blank" rel="noopener" aria-label="Instagram" style="color: var(--color-white); font-size: 1.8rem;"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </nav>

        <!-- Right Menu Actions (Language & Book CTA) -->
        <div class="header-actions">
            <!-- Language Selector -->
            <div class="lang-selector">
                <button class="lang-btn" aria-haspopup="true" aria-expanded="false" id="langBtn">
                    <i class="fa-solid fa-globe"></i>
                    <span class="active-lang-code">{{lang_upper}}</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <ul class="lang-dropdown" aria-labelledby="langBtn">
                    <li><a href="{{path_prefix}}fr/{{page_path}}" class="lang-dropdown-link {{active_lang_fr}}">FR</a></li>
                    <li><a href="{{path_prefix}}en/{{page_path}}" class="lang-dropdown-link {{active_lang_en}}">EN</a></li>
                    <li><a href="{{path_prefix}}de/{{page_path}}" class="lang-dropdown-link {{active_lang_de}}">DE</a></li>
                    <li><a href="{{path_prefix}}it/{{page_path}}" class="lang-dropdown-link {{active_lang_it}}">IT</a></li>
                    <li><a href="{{path_prefix}}es/{{page_path}}" class="lang-dropdown-link {{active_lang_es}}">ES</a></li>
                    <li><a href="{{path_prefix}}ru/{{page_path}}" class="lang-dropdown-link {{active_lang_ru}}">RU</a></li>
                    <li><a href="{{path_prefix}}en-au/{{page_path}}" class="lang-dropdown-link {{active_lang_en_au}}">EN-AU</a></li>
                </ul>
            </div>

            <!-- Header Booking CTA -->
            <div class="header-booking-wrapper" style="position: relative;">
                <button class="btn btn-secondary btn-book-header" id="headerBookingToggle" onclick="toggleHeaderBooking('desktopHeaderBookingPopup')">
                    {{nav.book}}
                </button>
                <!-- Desktop Popup -->
                <div id="desktopHeaderBookingPopup" style="display: none; position: absolute; top: 120%; right: 0; background: var(--color-primary); padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); flex-direction: column; gap: 10px;">
                    <form class="header-booking-form" action="{{booking_url}}" method="GET" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label for="dHeadCheckIn" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-regular fa-calendar-days"></i> {{booking_bar.check_in}}</label>
                            <input type="date" id="dHeadCheckIn" name="start_date" required style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label for="dHeadCheckOut" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-regular fa-calendar-days"></i> {{booking_bar.check_out}}</label>
                            <input type="date" id="dHeadCheckOut" name="end_date" required style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
                                <label for="dHeadGuests" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-solid fa-user"></i> {{booking_bar.guests}}</label>
                                <select id="dHeadGuests" name="adults" style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                    <option value="1" style="background: var(--color-primary);">1</option>
                                    <option value="2" selected style="background: var(--color-primary);">2</option>
                                    <option value="3" style="background: var(--color-primary);">3</option>
                                    <option value="4" style="background: var(--color-primary);">4</option>
                                </select>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
                                <label for="dHeadChildren" style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-secondary);"><i class="fa-solid fa-child"></i> {{booking_bar.children}}</label>
                                <select id="dHeadChildren" name="children" style="padding: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                    <option value="0" selected style="background: var(--color-primary);">0</option>
                                    <option value="1" style="background: var(--color-primary);">1</option>
                                    <option value="2" style="background: var(--color-primary);">2</option>
                                    <option value="3" style="background: var(--color-primary);">3</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 10px; padding: 10px;">{{booking_bar.search}}</button>
                    </form>
                </div>
            </div>
            
            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </div>
</header>

<style>
    /* Masquer l'ancienne barre de réservation pour ce test */
    .booking-bar-wrapper { display: none !important; }
</style>

<script>
function toggleHeaderBooking(popupId) {
    const popup = document.getElementById(popupId);
    if (popup.style.display === 'none' || popup.style.display === '') {
        popup.style.display = 'flex';
    } else {
        popup.style.display = 'none';
    }
}

// Close popup when clicking outside
document.addEventListener('click', function(event) {
    const desktopPopup = document.getElementById('desktopHeaderBookingPopup');
    const mobilePopup = document.getElementById('mobileHeaderBookingPopup');
    const desktopBtn = document.getElementById('headerBookingToggle');
    const mobileBtn = document.getElementById('mobileBookingToggle');
    
    if (desktopPopup && desktopBtn && !desktopPopup.contains(event.target) && !desktopBtn.contains(event.target)) {
        desktopPopup.style.display = 'none';
    }
    if (mobilePopup && mobileBtn && !mobilePopup.contains(event.target) && !mobileBtn.contains(event.target)) {
        mobilePopup.style.display = 'none';
    }
});
</script>
