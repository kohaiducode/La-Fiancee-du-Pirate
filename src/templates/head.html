<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{meta_title}}</title>
    <meta name="description" content="{{meta_desc}}">
    
    <!-- SEO & Accessibility -->
    <meta name="google-site-verification" content="L-fm39LQsEBaIxsLXHO74yusYx54RHUhlXlZELS1Jn4" />
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1a2b49">
    
    <!-- Hreflang Tags -->
    {{hreflang_tags}}
    
    <!-- Canonical Tag -->
    {{canonical_tag}}

    <!-- JSON-LD SEO Schema -->
    {{json_ld_script}}
    
    <!-- Open Graph (Facebook/Instagram sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="La Fiancée du Pirate">
    <meta property="og:title" content="{{meta_title}}">
    <meta property="og:description" content="{{og_desc}}">
    <meta property="og:image" content="{{base_url}}/assets/images/og_image.webp">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{path_prefix}}assets/css/style.css">
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>
